---
- import_playbook: autobook.yml

- name: Bootstrap a Salt master
  hosts: 127.0.0.1
  connection: local
  become: true
  vars:
    salt_release: '3008'
    salt_git_repo: https://git.sourcecraft.dev/paulmd/paulus-cloud-infra.git
    salt_git_branch: master
    salt_git_root: salt

  tasks:
    - name: Require Ubuntu 26.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'

    - name: Read bootstrap coordinates supplied by cloud-init
      ansible.builtin.include_vars:
        file: /etc/salt-bootstrap.json
        name: salt_bootstrap

    - name: Validate bootstrap coordinates
      ansible.builtin.assert:
        that:
          - salt_bootstrap.secret_id | length > 0
          - salt_bootstrap.version_id | length > 0

    - name: Get the VM service account token
      ansible.builtin.uri:
        url: http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token
        headers:
          Metadata-Flavor: Google
        use_proxy: false
        return_content: true
      register: salt_iam
      until: salt_iam.status | default(0) == 200
      retries: 12
      delay: 5
      no_log: true

    - name: Read the shared bootstrap credentials from Lockbox
      ansible.builtin.uri:
        url: "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/{{ salt_bootstrap.secret_id }}/payload?versionId={{ salt_bootstrap.version_id }}"
        headers:
          Authorization: "Bearer {{ salt_iam.json.access_token }}"
        return_content: true
      register: salt_lockbox
      until: salt_lockbox.status | default(0) == 200
      retries: 24
      delay: 5
      no_log: true

    - name: Decode Lockbox text entries
      ansible.builtin.set_fact:
        salt_credentials: "{{ salt_lockbox.json.entries | items2dict(key_name='key', value_name='textValue') }}"
      no_log: true

    - name: Check required credentials exist
      ansible.builtin.assert:
        that:
          - salt_credentials['master.pem'] | length > 0
          - salt_credentials['sourcecraft-token'] | trim | length > 0
      no_log: true

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, git, openssl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create Salt directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/apt/keyrings, mode: '0755'}
        - {path: /etc/salt/master.d, mode: '0755'}
        - {path: /etc/salt/pki/master, mode: '0700'}
        - {path: /etc/salt/git, mode: '0700'}

    - name: Download Salt repository signing key
      ansible.builtin.get_url:
        url: https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public
        dest: /etc/apt/keyrings/salt-archive-keyring.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure Salt package repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/salt.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://packages.broadcom.com/artifactory/saltproject-deb/
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/salt-archive-keyring.asc

    - name: Pin Salt to the selected LTS series
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/salt-pin-1001
        mode: '0644'
        content: |
          Package: salt-*
          Pin: version {{ salt_release }}.*
          Pin-Priority: 1001

    - name: Install Salt master and minion without starting unconfigured services
      ansible.builtin.apt:
        name:
          - "salt-master={{ salt_release }}.*"
          - "salt-minion={{ salt_release }}.*"
        state: present
        update_cache: true
        policy_rc_d: 101

    - name: Install the shared master private key
      ansible.builtin.copy:
        content: "{{ salt_credentials['master.pem'] | trim }}\n"
        dest: /etc/salt/pki/master/master.pem
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Derive the matching master public key
      ansible.builtin.command:
        argv: [openssl, rsa, -in, /etc/salt/pki/master/master.pem, -pubout]
      register: salt_master_public
      changed_when: false

    - name: Install the shared master public key
      ansible.builtin.copy:
        content: "{{ salt_master_public.stdout }}\n"
        dest: /etc/salt/pki/master/master.pub
        owner: root
        group: root
        mode: '0644'

    - name: Install the SourceCraft read-only token
      ansible.builtin.copy:
        content: "{{ salt_credentials['sourcecraft-token'] | trim }}\n"
        dest: /etc/salt/git/sourcecraft-token
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false

    - name: Provide credentials for the initial checkout
      ansible.builtin.copy:
        dest: /etc/salt/git/bootstrap-askpass
        mode: '0700'
        content: |
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' git ;;
            *Password*) cat /etc/salt/git/sourcecraft-token ;;
            *) exit 1 ;;
          esac

    - name: Check out Salt bootstrap code
      ansible.builtin.git:
        repo: "{{ salt_git_repo }}"
        dest: /srv/salt/autosalt/bootstrap
        version: "{{ salt_git_branch }}"
        depth: 1
        recursive: false
      environment:
        GIT_TERMINAL_PROMPT: '0'
        GIT_ASKPASS: /etc/salt/git/bootstrap-askpass
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        LC_ALL: C

    - name: Check whether the state checkout has been initialized
      ansible.builtin.stat:
        path: /srv/salt/autosalt/current
        follow: false
      register: salt_current

    - name: Expose the initial checkout on first boot
      ansible.builtin.file:
        src: "/srv/salt/autosalt/bootstrap/{{ salt_git_root }}"
        dest: /srv/salt/autosalt/current
        state: link
      when: not salt_current.stat.exists

    # Local mode breaks the first-boot dependency on an already configured master.
    # Salt states install the runner and configure/start both services.
    - name: Hand configuration over to Salt
      ansible.builtin.command:
        argv:
          - salt-call
          - --local
          - --retcode-passthrough
          - "--id={{ ansible_facts.hostname }}"
          - "--file-root=/srv/salt/autosalt/bootstrap/{{ salt_git_root }}"
          - state.apply
          - salt-master
      changed_when: true

    - name: Wait for both Salt master ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 60
      loop: [4505, 4506]

    - name: Verify the local minion can retrieve states from its master
      ansible.builtin.command:
        argv: [salt-call, --retcode-passthrough, --out=json, cp.list_master]
      register: salt_ping
      changed_when: false
      retries: 12
      delay: 5
      until: >-
        salt_ping.rc == 0 and
        'top.sls' in (salt_ping.stdout | from_json).get('local', [])
